<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>For You 🧡</title>

<style>

/* =========================
   BASIC SETUP
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================
   CANVAS
========================= */

canvas {
    display: block;

    width: 100vw;
    height: 100vh;

    background: #000;
}


/* =========================
   FIRST MESSAGE
========================= */

.message {
    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.9);

    color: white;

    font-size:
        clamp(24px, 6.5vw, 46px);

    font-weight: 500;

    white-space: nowrap;

    text-align: center;

    opacity: 0;

    pointer-events: none;

    text-shadow:
        0 0 8px
        rgba(255,255,255,.35);

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.message.show {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.message.hide {
    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(.9);
}


/* =========================
   FINAL MESSAGE
========================= */

.final-message {
    position: fixed;

    left: 50%;
    top: 68%;

    transform:
        translate(-50%, -50%)
        scale(.7);

    color: #ff9a5a;

    font-size:
        clamp(28px, 8vw, 52px);

    font-weight: 500;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    text-shadow:
        0 0 5px
        rgba(255,120,50,.5),

        0 0 15px
        rgba(255,80,20,.25);

    transition:
        opacity 1.2s ease,
        transform 1.2s
        cubic-bezier(.2,1.4,.4,1);
}

.final-message.show {
    opacity: 1;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.heart {
    display: inline-block;

    margin-left: 5px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .message {
        font-size: 25px;
    }

    .final-message {
        font-size: 32px;
    }
}

</style>
</head>


<body>


<!-- =========================
     TREE
========================= -->

<canvas id="treeCanvas"></canvas>


<!-- =========================
     FIRST TEXT
========================= -->

<div id="message"
     class="message">

    I want to give you something ❤️

</div>


<!-- =========================
     FINAL TEXT
========================= -->

<div id="finalMessage"
     class="final-message">

    For You <span class="heart">🧡</span>

</div>



<script>

/* =====================================================
   CANVAS SETUP
===================================================== */

const canvas =
    document.getElementById("treeCanvas");

const ctx =
    canvas.getContext("2d");


let W;
let H;


function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    W =
        window.innerWidth;

    H =
        window.innerHeight;


    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);



/* =====================================================
   RANDOM NUMBER
===================================================== */

let seed = 123456;


function random() {

    seed =
        (seed * 1664525 +
        1013904223)
        % 4294967296;

    return seed /
        4294967296;
}



/* =====================================================
   TREE ARRAYS
===================================================== */

let branches = [];

let leaves = [];



/* =====================================================
   CREATE TREE BRANCH
===================================================== */

function createBranch(
    x,
    y,
    angle,
    length,
    width,
    depth,
    delay
) {

    if (
        depth < 0 ||
        length < 4
    ) {
        return;
    }


    const x2 =
        x +
        Math.cos(angle) *
        length;


    const y2 =
        y +
        Math.sin(angle) *
        length;


    branches.push({

        x1: x,
        y1: y,

        x2: x2,
        y2: y2,

        width: width,

        depth: depth,

        delay: delay

    });



    /* -------------------------
       LEAVES
    ------------------------- */

    if (depth <= 1) {

        leaves.push({

            x: x2,

            y: y2,

            delay:
                delay + .2,

            size:
                1.5 +
                random() * 3.5

        });

        return;
    }



    /* -------------------------
       BRANCH ANGLES
    ------------------------- */

    const spread =
        .38 +
        random() * .15;


    const leftAngle =
        angle - spread;


    const rightAngle =
        angle + spread;



    const newLength =
        length *
        (
            .66 +
            random() * .08
        );


    const newWidth =
        width * .68;


    const nextDelay =
        delay + .12;



    /* LEFT */

    createBranch(

        x2,
        y2,

        leftAngle,

        newLength,

        newWidth,

        depth - 1,

        nextDelay

    );



    /* RIGHT */

    createBranch(

        x2,
        y2,

        rightAngle,

        newLength,

        newWidth,

        depth - 1,

        nextDelay

    );



    /* EXTRA BRANCH */

    if (
        depth >= 3 &&
        random() > .38
    ) {

        createBranch(

            x2,
            y2,

            angle +
            (random() - .5) *
            .8,

            newLength * .78,

            newWidth * .8,

            depth - 2,

            nextDelay + .08

        );
    }
}



/* =====================================================
   BUILD TREE
===================================================== */

function buildTree() {

    branches = [];

    leaves = [];

    seed = 123456;


    const baseX =
        W / 2;


    const baseY =
        H * .78;



    createBranch(

        baseX,

        baseY,

        -Math.PI / 2,

        H * .20,

        3.2,

        7,

        0

    );
}


buildTree();



/* =====================================================
   DRAW BRANCH
===================================================== */

function drawBranch(
    branch,
    progress
) {

    const localProgress =

        Math.max(

            0,

            Math.min(

                1,

                (
                    progress -
                    branch.delay
                ) / .32

            )

        );


    if (
        localProgress <= 0
    ) {
        return;
    }



    const x =

        branch.x1 +

        (
            branch.x2 -
            branch.x1
        ) *
        localProgress;



    const y =

        branch.y1 +

        (
            branch.y2 -
            branch.y1
        ) *
        localProgress;



    ctx.beginPath();


    ctx.moveTo(
        branch.x1,
        branch.y1
    );


    ctx.lineTo(
        x,
        y
    );



    /* -------------------------
       BRANCH COLOR
    ------------------------- */

    let color;


    if (
        branch.depth >= 6
    ) {

        color =
            "#21452d";

    } else {

        const red =
            Math.floor(
                65 +
                (
                    7 -
                    branch.depth
                ) * 14
            );


        color =
            `rgb(
                ${red},
                28,
                32
            )`;
    }



    ctx.strokeStyle =
        color;


    ctx.lineWidth =
        Math.max(
            .7,
            branch.width
        );


    ctx.lineCap =
        "round";


    ctx.stroke();
}



/* =====================================================
   DRAW ORANGE LEAVES
===================================================== */

function drawLeaf(
    leaf,
    progress
) {

    const appear =

        Math.max(

            0,

            Math.min(

                1,

                (
                    progress -
                    leaf.delay
                ) / .35

            )

        );


    if (
        appear <= 0
    ) {
        return;
    }



    const pulse =

        1 +

        Math.sin(
            performance.now() *
            .006 +
            leaf.x
        ) * .08;



    const size =

        leaf.size *
        appear *
        pulse;



    /* -------------------------
       GLOW
    ------------------------- */

    ctx.shadowBlur =
        8;

    ctx.shadowColor =
        "rgba(255,90,25,.65)";



    ctx.beginPath();


    ctx.arc(

        leaf.x,

        leaf.y,

        size,

        0,

        Math.PI * 2

    );



    const orange =

        150 +
        Math.floor(
            random() * 80
        );


    const green =

        45 +
        Math.floor(
            random() * 45
        );



    ctx.fillStyle =

        `rgb(
            ${orange},
            ${green},
            25
        )`;


    ctx.fill();


    ctx.shadowBlur =
        0;
}



/* =====================================================
   EXTRA FLOWERS
===================================================== */

function drawExtraFlowers(
    progress
) {

    if (
        progress < 3
    ) {
        return;
    }


    const amount =

        Math.min(

            leaves.length,

            Math.floor(
                (
                    progress -
                    3
                ) * 20
            )

        );



    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const leaf =
            leaves[i];


        const x =

            leaf.x +

            Math.sin(
                i * 17.3
            ) * 4;


        const y =

            leaf.y +

            Math.cos(
                i * 9.7
            ) * 4;


        const s =

            1.2 +

            Math.sin(i) *
            .5;



        ctx.beginPath();


        ctx.arc(

            x,
            y,
            s,

            0,
            Math.PI * 2

        );


        ctx.fillStyle =

            i % 3 === 0

                ? "#ff7a22"

                : "#d84a26";


        ctx.fill();
    }
}



/* =====================================================
   ANIMATION
===================================================== */

let startTime =
    performance.now();



function animate(now) {

    const elapsed =

        (
            now -
            startTime
        ) / 1000;



    /* CLEAR SCREEN */

    ctx.clearRect(

        0,
        0,
        W,
        H

    );



    /* -------------------------
       TREE START
    ------------------------- */

    const treeProgress =

        Math.max(

            0,

            elapsed -
            2.2

        );



    /* -------------------------
       BRANCHES
    ------------------------- */

    for (
        const branch
        of branches
    ) {

        drawBranch(

            branch,

            treeProgress

        );
    }



    /* -------------------------
       LEAVES
    ------------------------- */

    for (
        const leaf
        of leaves
    ) {

        drawLeaf(

            leaf,

            treeProgress

        );
    }



    /* -------------------------
       EXTRA FLOWERS
    ------------------------- */

    drawExtraFlowers(

        treeProgress

    );



    requestAnimationFrame(
        animate
    );
}



requestAnimationFrame(
    animate
);



/* =====================================================
   TEXT TIMELINE
===================================================== */

const message =
    document.getElementById(
        "message"
    );


const finalMessage =
    document.getElementById(
        "finalMessage"
    );



/* -------------------------
   SHOW FIRST TEXT
------------------------- */

setTimeout(
    () => {

        message.classList.add(
            "show"
        );

    },
    300
);



/* -------------------------
   HIDE FIRST TEXT
------------------------- */

setTimeout(
    () => {

        message.classList.remove(
            "show"
        );

        message.classList.add(
            "hide"
        );

    },
    2500
);



/* -------------------------
   SHOW FINAL TEXT
------------------------- */

setTimeout(
    () => {

        finalMessage.classList.add(
            "show"
        );

    },
    9500
);



/* -------------------------
   RESTART
------------------------- */

setTimeout(
    () => {

        location.reload();

    },
    14000
);

</script>

</body>
</html>
